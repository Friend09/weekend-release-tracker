name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.7'
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -m pytest -q
